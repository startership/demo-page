<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, Khang!</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2328;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
      }
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Hello, Khang!</h1>
</body>
</html>
